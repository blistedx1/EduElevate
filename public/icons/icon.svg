<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1F1A" />
      <stop offset="50%" stop-color="#122A24" />
      <stop offset="100%" stop-color="#1B3F36" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#34D399" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Academic / Coaching Shield and Chevron Emblem -->
  <g transform="translate(256, 205)">
    <!-- Outer ambient glow ring -->
    <circle r="120" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="8,8"/>
    
    <!-- Stylized Chevron Arrow Up (Elevate) -->
    <path d="M-70,50 L0,-20 L70,50 L46,68 L0,22 L-46,68 Z" fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- Stylized Top Academic Cap / Roof -->
    <path d="M0,-80 L80,-36 L0,8 L-80,-36 Z" fill="url(#parchmentGrad)"/>
    <path d="M-55,-20 L-55,32 Q0,68 55,32 L55,-20 L42,-14 L42,26 Q0,54 -42,26 L-42,-14 Z" fill="url(#goldGrad)"/>
    
    <!-- Tassel -->
    <path d="M68,-28 L78,-14 L76,16 L72,16 L71,-14 Z" fill="#34D399"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">EDUELEVATE</text>
  <text x="256" y="416" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#34D399" letter-spacing="4">COACHING ERP</text>
</svg>