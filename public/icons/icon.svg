<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark Chalkboard App Tile Background -->
  <rect width="512" height="512" rx="110" fill="#122A24"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#34D399" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Exact Shield Emblem from User Upload -->
  <g filter="url(#shadow)" transform="translate(0, 8)">
    <!-- Top Black Chevron Roof -->
    <polygon points="256,58 376,120 334,148 256,106 178,148 136,120" fill="#18181B"/>

    <!-- Left Red Wing / Bracket -->
    <polygon points="136,134 100,134 100,326 190,384 212,356 142,308 142,168" fill="#C61A29"/>

    <!-- Right Red Wing / Bracket -->
    <polygon points="376,134 412,134 412,326 322,384 300,356 370,308 370,168" fill="#C61A29"/>

    <!-- Center Hexagonal Shield: Outer White Trim -->
    <polygon points="256,112 352,162 352,318 256,380 160,318 160,162" fill="#FFFFFF"/>

    <!-- Center Hexagonal Shield: Deep Navy Blue Body -->
    <polygon points="256,124 340,168 340,310 256,368 172,310 172,168" fill="#0C2548"/>

    <!-- Bold Capital 'E' -->
    <text x="256" y="295" text-anchor="middle" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-size="172" font-weight="900" fill="#FFFFFF">E</text>

    <!-- Bottom Black Diamond / Point -->
    <polygon points="256,394 306,422 256,450 206,422" fill="#18181B"/>
  </g>
</svg>